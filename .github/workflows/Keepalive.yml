name: Keepalive

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable workflows via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有 workflow 并重新启用
          gh api repos/${{ github.repository }}/actions/workflows --paginate \
            -q '.workflows[] | select(.state=="disabled_inactivity") | .id' \
            | xargs -I {} gh api -X PUT repos/${{ github.repository }}/actions/workflows/{}/enable
